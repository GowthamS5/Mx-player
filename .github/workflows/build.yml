name: Build Ad-Free MX Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate MX Player Project
        run: |
          flutter create mx_player_pro --platforms=android
          cd mx_player_pro
          flutter pub add video_player file_picker
          cp ../player.dart lib/main.dart
          
          # build.gradle.kts ஃபைலில் compileSdk மதிப்பை துல்லியமாக 36 ஆக மாற்ற
          sed -i 's/.*/compileSdk = 36/' android/app/build.gradle.kts || true
          # ஒருவேளை build.gradle ஃபைல் இருந்தால் அதையும் மாற்ற
          find android/app -name "build.gradle" -exec sed -i 's/compileSdk.*/compileSdk 36/' {} + || true
          find android/app -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' {} + || true

      - name: Build Release APK
        working-directory: ./mx_player_pro
        run: flutter build apk --release

      - name: Upload MX Player APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-Player-Pro-NoAds-APK
          path: mx_player_pro/build/app/outputs/flutter-apk/app-release.apk
