name: Build Ad-Free MX Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate MX Player Project
        run: |
          flutter create mx_player_pro --platforms=android
          cd mx_player_pro
          flutter pub add video_player "file_picker:^8.0.0"
          cp ../player.dart lib/main.dart
          
          # build.gradle.kts ஃபைலில் உள்ள SDK பதிப்புகளை 36 ஆக மாற்ற
          python3 -c "
          path = 'android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('flutter.compileSdkVersion.toInt()', '36')
          content = content.replace('flutter.targetSdkVersion.toInt()', '36')
          content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          content = content.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build Release APK
        working-directory: ./mx_player_pro
        run: flutter build apk --release

      - name: Upload MX Player APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-Player-Pro-NoAds-APK
          path: mx_player_pro/build/app/outputs/flutter-apk/app-release.apk
